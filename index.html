<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MoodLog</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
  </head>

  <body>
    <div class="page-wrapper">
      <header>

      </header>

      <div class="layout-wrapper">

        <aside class="left-sidebar-wrapper">
          <div class="calendar-container">
            <div id="calendar-input-container">
              <input type="number" id="input-year" placeholder="年">
              <input type="number" id="input-month" placeholder="月">
              <button id="show-calendar">表示</button>
            </div>
            <div id="calendar-header-container">
              <div id="prev-month">前月</div>
              <span id="current-month"></span>
              <div id="next-month">翌月</div>
            </div>
            <div id="calendar-container">
              <div id="calendar-weekdays-container">
                <span class="weekday sun">日</span>
                <span class="weekday mon">月</span>
                <span class="weekday tue">火</span>
                <span class="weekday wed">水</span>
                <span class="weekday thu">木</span>
                <span class="weekday fri">金</span>
                <span class="weekday sat">土</span>
              </div>
              <div id="calendar-days-container"></div>
            </div>
          </div>
        </aside>

        <main class="main-wrapper">

          <div class="main-container">
            <div class="date-info-container"></div>
            <div class="date-header-container">
              <div id="prev-date">前日</div>
              <span id="current-date"></span>
              <div id="next-date">翌日</div>
            </div>
            <div class="graph-container"></div>
            <div class="graph-info-container"></div>
            <div class="record-mood-container">
              <button>気分を記録</button>
            </div>
          </div>

        </main>

        <aside class="right-sidebar-wrapper">

        </aside>
      </div>
      
      <footer>

      </footer>
    </div>
    
  </body>
</html>
